[pytest]
# pytest-django: which settings to load (the test settings, see the file)
DJANGO_SETTINGS_MODULE = config.settings_test

# Tests live only in tests/ (unit/ and integration/)
testpaths = tests
python_files = test_*.py

# --reuse-db       keep the test database between runs: migrations are not
#                  run from scratch every time (new migrations are still
#                  applied). After a migration was changed or deleted:
#                  pytest --create-db
# --strict-markers a typo in @pytest.mark.<name> is an error, not a new mark
# --cov            measure coverage (settings in .coveragerc); turn it off
#                  for a quick run of one test: pytest --no-cov ...
addopts =
    --reuse-db
    --strict-markers
    --cov
    --cov-report=term-missing:skip-covered

# pytest-asyncio: "async def test_..." runs in an event loop without
# @pytest.mark.asyncio on every test; a new loop for every test
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
asyncio_default_test_loop_scope = function
